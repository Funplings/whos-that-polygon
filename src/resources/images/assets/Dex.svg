<svg width="198" height="198" viewBox="0 0 198 198" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Rebuilt from the original mask-based export: the ring and band were
     32-unit strokes clipped by luminance masks, which double-antialias and
     look pixelated at icon sizes. Same geometry, plain shapes, and the
     corrected coral (#F9574D). -->
<clipPath id="ball"><circle cx="99" cy="99" r="99"/></clipPath>
<g clip-path="url(#ball)">
  <path d="M0 99a99 99 0 0 1 198 0Z" fill="#F9574D"/>
  <path d="M0 99a99 99 0 0 0 198 0Z" fill="#fff"/>
  <rect x="0" y="83" width="198" height="32" fill="#753945"/>
</g>
<circle cx="99" cy="99" r="91" fill="none" stroke="#753945" stroke-width="16"/>
<circle cx="99" cy="99" r="35" fill="#753945"/>
<circle cx="99" cy="99" r="21" fill="#fff"/>
</svg>
